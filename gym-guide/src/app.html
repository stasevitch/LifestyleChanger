<title>Gym Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* One phone-width column, sticky title bar, bottom tab bar. Machine drawings carry the page: grey frame, person in ink, the part you move in orange. */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #ecefe9;
  --ink: #18211c;
  --muted: #5b675f;
  --line: #dce1da;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dfeee9;
  --hot: #d9582b;
  --frame: #9aa59d;
  --pad: #c9d1ca;
  --person: #2b3a33;
  --shadow: 0 1px 2px rgba(24,33,28,.06), 0 4px 16px rgba(24,33,28,.06);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Sora", "Figtree", system-ui, -apple-system, sans-serif;
  --r: 16px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #19201b; --surface-2: #212a24; --ink: #e6ece7; --muted: #9aa69e; --line: #2a352e;
    --accent: #5cc4ad; --accent-ink: #0b1a16; --accent-soft: #1b3530; --hot: #f2804f; --frame: #6d7a71; --pad: #3a463e; --person: #dbe4dd;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #19201b; --surface-2: #212a24; --ink: #e6ece7; --muted: #9aa69e; --line: #2a352e;
  --accent: #5cc4ad; --accent-ink: #0b1a16; --accent-soft: #1b3530; --hot: #f2804f; --frame: #6d7a71; --pad: #3a463e; --person: #dbe4dd;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; min-height: 56px; }
.top h1 { margin: 0; font-family: var(--font-head); font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }

main.wrap { padding-block: 4px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px); }
.view { display: grid; gap: 14px; }
h2.sec { margin: 8px 0 0; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
p { margin: 0; }

/* Identify */
.q h2 { margin: 0; font-family: var(--font-head); font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
.q .step { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; min-height: 112px; box-shadow: var(--shadow); }
.opt:active { transform: scale(.98); }
.opt .ico { width: 44px; height: 44px; color: var(--accent); }
.opt b { font-size: 1rem; line-height: 1.2; }
.opt span { color: var(--muted); font-size: .82rem; line-height: 1.3; }
.opt.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
.opt.wide div { display: grid; gap: 2px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .85rem; padding: 5px 11px; border-radius: 999px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; }
.howto { background: var(--accent-soft); border-radius: 14px; padding: 14px; display: grid; gap: 6px; font-size: .9rem; }
.howto b { font-size: .95rem; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }

/* Machine cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mc { display: flex; flex-direction: column; text-align: left; border: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 8px 12px; gap: 4px; min-width: 0; }
.mc .art { background: var(--surface-2); border-radius: 10px; }
.mc b { font-size: .95rem; line-height: 1.25; padding: 4px 4px 0; }
.mc span { font-size: .8rem; color: var(--muted); line-height: 1.3; padding: 0 4px; }
.art { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }

/* Browse */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 0 12px; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; flex: 1; min-width: 0; padding: 12px 0; outline: none; font-size: 1rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); }

/* Detail */
.hero { padding: 0; overflow: hidden; }
.hero .art { background: var(--surface-2); }
.hero .body { padding: 14px 16px 16px; display: grid; gap: 8px; }
.hero h2 { margin: 0; font-family: var(--font-head); font-size: 1.45rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.aka { color: var(--muted); font-size: .9rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--hot); margin-right: 5px; vertical-align: -1px; }
.sect { display: grid; gap: 8px; }
.sect h3 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sect h3 svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.sect ol, .sect ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.sect.warn h3 svg { color: var(--hot); }
.start { border-left: 4px solid var(--accent); }
.note { font-size: .8rem; color: var(--muted); text-align: center; padding: 4px 12px; }

/* Machine drawing */
.art .l { fill: none; stroke: var(--frame); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .pad { fill: var(--pad); }
.art .flr { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.art .bd { fill: none; stroke: var(--person); stroke-linecap: round; stroke-linejoin: round; stroke-width: 7; }
.art .bd .t { stroke-width: 12; }
.art .bd circle { fill: var(--person); stroke: none; }
.art .mv { fill: none; stroke: var(--hot); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .mvf { fill: var(--hot); }
.art .ar { fill: none; stroke: var(--hot); stroke-width: 2.5; stroke-dasharray: 5 4; stroke-linecap: round; marker-end: url(#arrowhead); }
.art .dsh { fill: none; stroke: var(--frame); stroke-width: 2; stroke-dasharray: 4 4; }

/* Tabs */
.tabs { position: fixed; inset: auto 0 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: 1fr 1fr; height: var(--tabbar); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* ---- Tracker ---- */
:root { --danger: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --danger: #f2766b; } }
:root[data-theme="dark"] { --danger: #f2766b; }
.tabs .wrap { grid-template-columns: repeat(5, 1fr); }
.hbtn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink); }
.hbtn svg { width: 20px; height: 20px; }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; font-size: 1rem; width: 100%; text-align: center; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface-2); color: var(--ink); }
.btn.small { width: auto; padding: 9px 14px; font-size: .92rem; }
.btn.bad { background: none; color: var(--danger); }
.btns { display: flex; gap: 8px; }
.btns .btn { flex: 1; }
.hello { display: grid; gap: 12px; }
.hello > *, .btn { min-width: 0; }
.hello h2 { margin: 0; font-family: var(--font-head); font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; }
.btn.sec small { display: block; font-weight: 500; color: var(--muted); font-size: .82rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.tile { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
.tile dt { font-size: .8rem; color: var(--muted); font-weight: 600; }
.tile dd { margin: 2px 0 0; font-family: var(--font-head); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile dd small { font-family: var(--font-ui); font-size: .8rem; color: var(--muted); font-weight: 500; margin-left: 3px; letter-spacing: 0; }

.sess-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sess-head .clock { font-family: var(--font-head); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sess-head .muted { font-size: .85rem; }
.ex { display: grid; gap: 6px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ex-name { border: 0; background: none; padding: 0; font-weight: 700; font-size: 1.05rem; text-align: left; color: var(--ink); min-width: 0; }
.ex-name::after { content: " ›"; color: var(--muted); }
.ex-x { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 8px; }
.ex-x svg { width: 18px; height: 18px; display: block; }
.last { font-size: .85rem; color: var(--muted); }
.sets { display: grid; gap: 6px; margin-top: 4px; }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set-row.one { grid-template-columns: 28px 1fr 46px; }
.set-row.h { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
.set-row input { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 6px; font-size: 1.05rem; text-align: center; font-variant-numeric: tabular-nums; }
.set-row input:focus { border-color: var(--accent); outline: none; }
.set-row input.bad { border-color: var(--danger); }
.set-row.done input { background: var(--accent-soft); border-color: transparent; }
.set-n { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.tick { width: 46px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.tick svg { width: 22px; height: 22px; }
.tick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ex-foot { display: flex; gap: 8px; margin-top: 6px; }
.ex-foot button { flex: 1; border: 0; background: var(--surface-2); border-radius: 10px; padding: 9px; font-weight: 600; font-size: .9rem; }
.add-ex { border: 2px dashed var(--line); background: none; border-radius: var(--r); padding: 16px; font-weight: 700; color: var(--accent); width: 100%; }
.msg { border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border-left: 4px solid var(--danger); font-size: .92rem; }

.rest { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 24; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.rest .in { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.rest span { font-size: .85rem; font-weight: 600; }
.rest b { font-family: var(--font-head); font-variant-numeric: tabular-nums; font-size: 1.15rem; min-width: 2.9em; }
.rest button { border: 0; background: color-mix(in srgb, var(--bg) 20%, transparent); color: inherit; border-radius: 999px; padding: 7px 11px; font-weight: 700; font-size: .85rem; }
.rest.over .in { background: var(--accent); color: var(--accent-ink); }

.wk { display: grid; gap: 4px; text-align: left; border: 0; width: 100%; }
.wk .d { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.wk .d span { color: var(--muted); font-weight: 500; font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk .m { font-size: .88rem; color: var(--muted); }
.done-banner { background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.done-banner h2 { margin: 0; font-family: var(--font-head); font-size: 1.3rem; font-weight: 600; }
.done-banner ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.sum div { background: var(--surface-2); border-radius: 12px; padding: 10px; min-width: 0; }
.sum dt { font-size: .74rem; color: var(--muted); font-weight: 600; }
.sum dd { margin: 2px 0 0; font-family: var(--font-head); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-line { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.item-line:first-child { border-top: 0; padding-top: 0; }
.item-line b { font-weight: 700; }
.item-line span { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }

.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .wash { fill: var(--accent); opacity: .1; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .rule { stroke: var(--muted); stroke-width: 1; }
.chart .hit { fill: transparent; }
.tip { position: absolute; top: 0; left: 0; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; line-height: 1.3; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 2; }
.tip b { display: block; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart-head h3 { margin: 0; font-size: 1rem; font-weight: 700; }
.chart-head span { color: var(--muted); font-size: .85rem; }
.rec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.rec div { background: var(--surface-2); border-radius: 12px; padding: 10px; min-width: 0; }
.rec dt { font-size: .74rem; color: var(--muted); font-weight: 600; }
.rec dd { margin: 2px 0 0; font-family: var(--font-head); font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; }
.prog-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 12px 0; border-top: 1px solid var(--line); }
.prog-row:first-child { border-top: 0; padding-top: 0; }
.prog-row b { font-weight: 700; min-width: 0; }
.prog-row .s { color: var(--muted); font-size: .85rem; grid-column: 1; }
.prog-row svg { grid-row: 1 / 3; grid-column: 2; width: 84px; height: 32px; }
.spark { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark-end { fill: var(--accent); }

.pick { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 8px 0; border-top: 1px solid var(--line); text-align: left; }
.pick:first-child { border-top: 0; }
.pick .th { width: 64px; flex: none; }
.pick .th .art { background: var(--surface-2); border-radius: 8px; }
.pick .ph { width: 64px; height: 48px; flex: none; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-weight: 700; font-size: .8rem; }
.pick div { min-width: 0; display: grid; }
.pick b { font-weight: 600; }
.pick span { font-size: .8rem; color: var(--muted); }
.pick em { font-style: normal; margin-left: auto; font-size: .75rem; font-weight: 700; color: var(--accent); flex: none; }
.field { display: grid; gap: 6px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.field input, .field select { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 1rem; color: var(--ink); font-weight: 500; width: 100%; }
.form { display: grid; gap: 12px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.setting b { font-weight: 600; }
.idcard { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; width: 100%; background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.idcard svg { width: 36px; height: 36px; color: var(--accent); flex: none; }
.idcard div { display: grid; gap: 2px; }
.idcard span { color: var(--muted); font-size: .85rem; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; font-weight: 600; z-index: 40; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
</style>
<!-- /head -->

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hot)"/></marker>
</defs></svg>

<header class="top" id="top">
  <div class="wrap">

const R = (x, y, w, h, rot) => `<rect class="pad" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"${rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ''}/>`;

const M = (...a) => `<path class="mv" d="${pts(a)}"/>`;          // the part you move
const Mc = (x, y, r) => `<circle class="mvf" cx="${x}" cy="${y}" r="${r}"/>`;
const A = d => `<path class="ar" d="${d}"/>`;                    // motion arrow
const D = d => `<path class="dsh" d="${d}"/>`;                   // dashed guide (path of motion, cable)

function art(m, label) {
  return `<svg class="art" viewBox="0 0 200 150" role="img" aria-label="${esc(label || m.name)}">${FLOOR}${m.art}</svg>`;
}

// ---------- Charts ----------
function niceTicks(lo, hi, n = 4) {

  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];

  return out;
}
const tickLabel = t => t >= 10000 ? (t / 1000) + 'K' : String(t);
// Single series, so no legend: the heading says what is plotted. Tap or hover shows the value.
function lineChart(el, pts, fmt) {
  const W = Math.max(260, el.clientWidth || 320), H = 190, pl = 40, pr = 14, pt = 18, pb = 26;
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const X = t => pts.length === 1 ? (pl + W - pr) / 2 : pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const xy = pts.map(p => [X(p.t), Y(p.y)]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const last = xy[xy.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(el.dataset.label || '')}">
    ${ticks.map(t => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${tickLabel(t)}</text>`).join('')}
    <text class="ax" x="${xy[0][0]}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${esc(fmtShort(t0))}</text>
    ${pts.length > 1 ? `<text class="ax" x="${last[0]}" y="${H - 6}" text-anchor="end">${esc(fmtShort(t1))}</text>` : ''}
    ${pts.length > 1 ? `<path class="wash" d="${line}L${last[0]} ${Y(y0)}L${xy[0][0]} ${Y(y0)}Z"/><path class="ln" d="${line}"/>` : ''}
    <line class="rule" id="rule" y1="${pt}" y2="${H - pb}" visibility="hidden"/>
    ${xy.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="${pts.length > 24 ? 3 : 4.5}"/>`).join('')}
    <rect class="hit" x="0" y="0" width="${W}" height="${H}"/></svg><div class="tip" hidden></div>`;
  hover(el, xy.map(p => p[0]), i => ({ x: xy[i][0], y: xy[i][1], html: `<b>${esc(fmt(pts[i].y))}</b>${esc(pts[i].tip)}` }), true);
}
function colChart(el, bars, fmt) {
  const W = Math.max(260, el.clientWidth || 320), H = 170, pl = 32, pr = 6, pt = 18, pb = 24;
  const ticks = niceTicks(0, Math.max(1, ...bars.map(b => b.v)), 3), top = ticks[ticks.length - 1];

    ${ticks.map(t => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${tickLabel(t)}</text>`).join('')}

// ---------- Navigation ----------
const MAIN = ['workout', 'progress', 'programs', 'history', 'machines'];
const TITLES = { programs: 'Programs', workout: 'Workout', history: 'History', progress: 'Progress', machines: 'Machines', identify: 'What\'s this machine?', add: 'Add exercise', settings: 'Settings' };
const scrollMemo = {};
let navDepth = 0;
function show(view) {
  for (const s of document.querySelectorAll('main > .view')) s.hidden = s.id !== 'view-' + view;
  const sub = !MAIN.includes(view);
  $('#back').hidden = !sub; $('#gear').hidden = sub;
  if (!sub) app.tab = view;
  document.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', t.dataset.view === app.tab));
}
function route() {
  const h = location.hash.slice(1) || 'workout';
  let view = h.split('/')[0], arg = h.slice(view.length + 1);
  if (view === 'p') { renderProgram(arg); show('program'); $('#title').textContent = progById(arg)?.name || 'Program'; }
  else if (view === 'm') { renderMachine(arg); show('machine'); $('#title').textContent = exById(arg)?.name || 'Exercise'; }
  else if (view === 'w') { renderSession(arg); show('session'); const w = store.workouts.find(x => x.id === arg); $('#title').textContent = w ? fmtDay(w.start) : 'Workout'; }
  else {
    if (!TITLES[view]) view = 'workout';
    ({ programs: renderPrograms, workout: renderWorkout, history: renderHistory, progress: renderProgress, machines: renderMachines, identify: renderIdentify, add: renderAdd, settings: renderSettings })[view]();
    show(view); $('#title').textContent = view === 'add' && app.addFor === 'edit' ? 'Add to this workout' : TITLES[view];
  }
  window.scrollTo(0, scrollMemo[h] || 0);
  if (view !== 'w') app.justSaved = null;
}
function go(hash) { scrollMemo[location.hash.slice(1) || 'workout'] = window.scrollY; navDepth++; location.hash = hash; }
function back() { if (navDepth > 0) { navDepth--; history.back(); } else location.replace('#' + app.tab); }
window.addEventListener('hashchange', route);

// ---------- Events ----------
function itemFrom(el) { const c = el.closest('.ex'); const W = c && c.closest('#view-session') ? app.edit : store.active; return c && W ? { W, it: W.items[+c.dataset.i], i: +c.dataset.i, card: c } : null; }
function rerenderCard(ctx) { const mode = ctx.W === app.edit ? 'edit' : 'active'; ctx.card.outerHTML = itemCard(ctx.it, ctx.i, mode); }
document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const ctx = itemFrom(e.target); if (!ctx) return;
  const s = ctx.it.sets[+e.target.closest('.set-row').dataset.s], n = num(e.target.value);
  s[f] = n == null ? null : f === 'w' ? wOut(n) : f === 'km' ? dOut(n) : n;
  e.target.classList.remove('bad'); save();
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const act = t.dataset.act;
  if (t.dataset.m) return go('#m/' + t.dataset.m);
  if (t.dataset.w) return go('#w/' + t.dataset.w);
  if (t.dataset.p) return go('#p/' + t.dataset.p);
  if (t.dataset.level) { app.level = t.dataset.level; return renderPrograms(); }
  if (t.dataset.pick) return pick(t.dataset.pick);
  if (t.dataset.view) {
    if (t.dataset.view === 'machines' && app.tab === 'machines' && $('#view-machines').hidden === false) return window.scrollTo(0, 0);
    navDepth = 0; return location.hash = '#' + t.dataset.view;
  }
  if (t.dataset.go) return go('#' + t.dataset.go);
  if (t.id === 'back') return back();
  if (t.id === 'gear') return go('#settings');
  if (t.dataset.g) { app.group = t.dataset.g; return renderMachines(); }
  if (t.dataset.reset) { if (t.dataset.reset === 'pos') app.pos = null; app.move = null; renderIdentify(); return window.scrollTo(0, 0); }
  if (t.dataset.metric) { app.metric[t.dataset.id] = t.dataset.metric; return renderExProgress(exById(t.dataset.id)); }
  if (t.dataset.unit) { store.settings.unit = t.dataset.unit; save(); return renderSettings(); }
  if (t.dataset.rest) { store.settings.rest = +t.dataset.rest; save(); return renderSettings(); }
  const q = t.closest('[data-q]');
  if (q) { app[q.dataset.q] = t.dataset.v; renderIdentify(); return window.scrollTo(0, 0); }
  if (!act) return;
  const ctx = itemFrom(t);
  switch (act) {
    case 'start': startWorkout(); renderWorkout(); break;
    case 'start-day': startProgramDay(+t.dataset.day); renderWorkout(); window.scrollTo(0, 0); break;
    case 'follow': { const p = progById(t.dataset.id), cur = store.program && progById(store.program.id);
      if (cur && !confirm(`Stop following ${cur.name} and start ${p.name}? Your past workouts stay.`)) break;
      store.program = { id: p.id, start: Date.now(), next: 0 }; save(); toast(`Started ${p.name}`); navDepth = 0; location.hash = '#workout'; break; }
    case 'stop-program': if (confirm('Stop following this program? Your past workouts stay.')) { store.program = null; save(); renderProgram(location.hash.slice(3)); } break;
    case 'repeat': { const l = sortedWorkouts().pop(); startWorkout(l.items.filter(it => exById(it.ex)).map(it => newItem(it.ex))); renderWorkout(); break; }
    case 'repeat-this': { if (store.active && !confirm('You already have a workout going. Add these exercises to it?')) break;
      const w = store.workouts.find(x => x.id === location.hash.slice(3)); const items = w.items.filter(it => exById(it.ex)).map(it => newItem(it.ex));
      if (store.active) { store.active.items.push(...items); save(); } else startWorkout(items);
      navDepth = 0; location.hash = '#workout'; break; }
    case 'go-start': if (!store.active) startWorkout(); navDepth = 0; location.hash = '#workout'; break;
    case 'go-workout': navDepth = 0; location.hash = '#workout'; break;
    case 'start-this': startWorkout([newItem(t.dataset.id)]); navDepth = 0; location.hash = '#workout'; break;
    case 'add-this': store.active.items.push(newItem(t.dataset.id)); save(); toast('Added to today\'s workout'); renderMachine(t.dataset.id); break;
    case 'add': app.addFor = t.closest('#view-session') ? 'edit' : 'active'; app.addQ = ''; go('#add'); break;
    case 'finish': finishWorkout(); break;
    case 'discard': if (confirm('Discard this workout? Nothing from it will be saved.')) { store.active = null; save(); stopRest(); renderWorkout(); } break;
    case 'tick': {
      const row = t.closest('.set-row'), s = ctx.it.sets[+row.dataset.s], type = typeOf(exById(ctx.it.ex));
      if (!s.done && !validSet(type, s)) { const empty = [...row.querySelectorAll('input')].find(x => num(x.value) == null || (x.dataset.f !== 'w' && x.dataset.f !== 'km' && num(x.value) <= 0)) || row.querySelector('input'); empty.classList.add('bad'); empty.focus(); break; }
      s.done = !s.done; save(); rerenderCard(ctx);
      const head = document.querySelector('#view-workout .sess-head .muted'); if (head) head.textContent = `Started ${fmtTime(store.active.start)} · ${plural(store.active.items.reduce((a, it) => a + it.sets.filter(x => x.done).length, 0), 'set')} done`;
      if (s.done) startRest(ctx.it.target && ctx.it.target.rest); break; }
    case 'add-set': { const type = typeOf(exById(ctx.it.ex)), prev = ctx.it.sets[ctx.it.sets.length - 1];
      const s = prev ? { ...prev, done: ctx.W === app.edit } : { ...blankSet(type), done: ctx.W === app.edit }; if (ctx.W !== app.edit) s.done = false;

    case 'remove-ex': { const done = ctx.it.sets.some(s => s.done); if (done && ctx.W !== app.edit && !confirm('Remove this exercise and its sets?')) break;

    case 'rest-minus': rest.end -= 15000; tickRest(); break;
    case 'rest-plus': rest.end = Math.max(rest.end, Date.now()) + 15000; rest.over = false; $('#rest').classList.remove('over'); tickRest(); break;
    case 'rest-skip': stopRest(); break;
    case 'edit': { const w = store.workouts.find(x => x.id === location.hash.slice(3)); app.edit = JSON.parse(JSON.stringify(w)); app.edit.items.forEach(it => it.sets.forEach(s => s.done = true)); renderSession(w.id); window.scrollTo(0, 0); break; }
    case 'edit-cancel': { const id = app.edit.id; app.edit = null; renderSession(id); break; }
    case 'edit-save': {
      const E = app.edit, items = E.items.map(it => ({ ex: it.ex, sets: it.sets.filter(s => validSet(typeOf(exById(it.ex)), s)).map(({ done, ...s }) => s) })).filter(it => it.sets.length);
      if (!items.length) { $('#finish-msg').innerHTML = '<p class="msg">Nothing left to save. Delete the workout instead.</p>'; break; }
      const w = store.workouts.find(x => x.id === E.id); w.items = items; app.edit = null; save(); toast('Changes saved'); renderSession(w.id); break; }
    case 'delete-w': if (confirm('Delete this workout? This can\'t be undone.')) { store.workouts = store.workouts.filter(x => x.id !== location.hash.slice(3)); save(); toast('Workout deleted'); back(); } break;
    case 'delete-custom': { const id = t.dataset.id, used = store.workouts.some(w => w.items.some(it => it.ex === id));
      if (used) { toast('It\'s used in your workouts, so it stays.'); break; }
      if (confirm('Delete this exercise?')) { store.custom = store.custom.filter(c => c.id !== id); if (store.active) store.active.items = store.active.items.filter(it => it.ex !== id); save(); back(); } break; }
    case 'export': exportBackup(); break;
    case 'wipe': if (confirm('Delete all workouts and your own exercises from this phone? Export a backup first if you want to keep them.')) { store = DEFAULTS(); save(); toast('All workouts deleted'); renderSettings(); } break;
  }
});
// Moving to the next field: Enter in a set input jumps to the next input
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset.f) return;
  const all = [...document.querySelectorAll('.view:not([hidden]) [data-f]')], i = all.indexOf(e.target);
  e.preventDefault(); if (all[i + 1]) all[i + 1].focus(); else e.target.blur();
});
setInterval(() => { const el = $('#elapsed'); if (el && store.active) el.textContent = clock(Date.now() - store.active.start); }, 1000);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const h = location.hash; if (h === '#progress') renderProgress(); else if (h.startsWith('#m/') && $('#ch-ex')) renderExProgress(exById(h.slice(3))); }, 200); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
window.GG = { MACHINES, FREE, PROGRAMS, app, get store() { return store; }, set store(s) { store = s; }, save, stats, records };
