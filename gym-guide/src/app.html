<title>Gym Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* One phone-width column, sticky title bar, bottom tab bar. Machine drawings carry the page: grey frame, person in ink, the part you move in orange. */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #ecefe9;
  --ink: #18211c;
  --muted: #5b675f;
  --line: #dce1da;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dfeee9;
  --hot: #d9582b;
  --frame: #9aa59d;
  --pad: #c9d1ca;
  --person: #2b3a33;
  --shadow: 0 1px 2px rgba(24,33,28,.06), 0 4px 16px rgba(24,33,28,.06);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Sora", "Figtree", system-ui, -apple-system, sans-serif;
  --r: 16px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #19201b; --surface-2: #212a24; --ink: #e6ece7; --muted: #9aa69e; --line: #2a352e;
    --accent: #5cc4ad; --accent-ink: #0b1a16; --accent-soft: #1b3530; --hot: #f2804f; --frame: #6d7a71; --pad: #3a463e; --person: #dbe4dd;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #19201b; --surface-2: #212a24; --ink: #e6ece7; --muted: #9aa69e; --line: #2a352e;
  --accent: #5cc4ad; --accent-ink: #0b1a16; --accent-soft: #1b3530; --hot: #f2804f; --frame: #6d7a71; --pad: #3a463e; --person: #dbe4dd;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; min-height: 56px; }
.top h1 { margin: 0; font-family: var(--font-head); font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }

main.wrap { padding-block: 4px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px); }
.view { display: grid; gap: 14px; }
h2.sec { margin: 8px 0 0; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
p { margin: 0; }

/* Identify */
.q h2 { margin: 0; font-family: var(--font-head); font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
.q .step { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; min-height: 112px; box-shadow: var(--shadow); }
.opt:active { transform: scale(.98); }
.opt .ico { width: 44px; height: 44px; color: var(--accent); }
.opt b { font-size: 1rem; line-height: 1.2; }
.opt span { color: var(--muted); font-size: .82rem; line-height: 1.3; }
.opt.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
.opt.wide div { display: grid; gap: 2px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .85rem; padding: 5px 11px; border-radius: 999px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; }
.howto { background: var(--accent-soft); border-radius: 14px; padding: 14px; display: grid; gap: 6px; font-size: .9rem; }
.howto b { font-size: .95rem; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }

/* Machine cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mc { display: flex; flex-direction: column; text-align: left; border: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 8px 12px; gap: 4px; min-width: 0; }
.mc .art { background: var(--surface-2); border-radius: 10px; }
.mc b { font-size: .95rem; line-height: 1.25; padding: 4px 4px 0; }
.mc span { font-size: .8rem; color: var(--muted); line-height: 1.3; padding: 0 4px; }
.art { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }

/* Browse */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 0 12px; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; flex: 1; min-width: 0; padding: 12px 0; outline: none; font-size: 1rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); }

/* Detail */
.hero { padding: 0; overflow: hidden; }
.hero .art { background: var(--surface-2); }
.hero .body { padding: 14px 16px 16px; display: grid; gap: 8px; }
.hero h2 { margin: 0; font-family: var(--font-head); font-size: 1.45rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.aka { color: var(--muted); font-size: .9rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--hot); margin-right: 5px; vertical-align: -1px; }
.sect { display: grid; gap: 8px; }
.sect h3 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sect h3 svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.sect ol, .sect ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.sect.warn h3 svg { color: var(--hot); }
.start { border-left: 4px solid var(--accent); }
.note { font-size: .8rem; color: var(--muted); text-align: center; padding: 4px 12px; }

/* Machine drawing */
.art .l { fill: none; stroke: var(--frame); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .pad { fill: var(--pad); }
.art .flr { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.art .bd { fill: none; stroke: var(--person); stroke-linecap: round; stroke-linejoin: round; stroke-width: 7; }
.art .bd .t { stroke-width: 12; }
.art .bd circle { fill: var(--person); stroke: none; }
.art .mv { fill: none; stroke: var(--hot); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .mvf { fill: var(--hot); }
.art .ar { fill: none; stroke: var(--hot); stroke-width: 2.5; stroke-dasharray: 5 4; stroke-linecap: round; marker-end: url(#arrowhead); }
.art .dsh { fill: none; stroke: var(--frame); stroke-width: 2; stroke-dasharray: 4 4; }

/* Tabs */
.tabs { position: fixed; inset: auto 0 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: 1fr 1fr; height: var(--tabbar); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
</style>
<!-- /head -->

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hot)"/></marker>
</defs></svg>

<header class="top" id="top">
  <div class="wrap">
    <button class="back" id="back" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title">Gym Guide</h1>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-identify" aria-label="Identify"></section>
  <section class="view" id="view-browse" aria-label="Browse" hidden></section>
  <section class="view" id="view-machine" aria-label="Machine" hidden></section>
</main>

<nav class="tabs" aria-label="Main">
  <div class="wrap">
    <button class="tab" data-view="identify" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/><path d="M9.2 9.3a2 2 0 1 1 2.6 2c-.6.3-.8.7-.8 1.2"/><path d="M11 14.6h.01"/></svg><span>What's this?</span></button>
    <button class="tab" data-view="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>All machines</span></button>
  </div>
</nav>

<script>
'use strict';
// ---------- Drawing helpers (viewBox 0 0 200 150, person faces right unless the drawing is a front view) ----------
const pts = a => a.reduce((s, v, i) => s + (i % 2 ? ',' + v : (i ? ' L' : 'M') + v), '');
const L = (...a) => `<path class="l" d="${pts(a)}"/>`;          // frame
const R = (x, y, w, h, rot) => `<rect class="pad" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"${rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ''}/>`;
const Rp = (x, y, r) => `<circle class="pad" cx="${x}" cy="${y}" r="${r}"/>`;                   // roller pad
const M = (...a) => `<path class="mv" d="${pts(a)}"/>`;          // the part you move
const Mc = (x, y, r) => `<circle class="mvf" cx="${x}" cy="${y}" r="${r}"/>`;
const A = d => `<path class="ar" d="${d}"/>`;                    // motion arrow
const D = d => `<path class="dsh" d="${d}"/>`;                   // dashed guide (path of motion, cable)
const FLOOR = '<path class="flr" d="M12 142H188"/>';
// Person: head [x,y], torso [shoulder x,y, hip x,y], limbs [[x,y,...], ...]
const B = (h, t, ...limbs) => `<g class="bd"><path class="t" d="${pts(t)}"/>${limbs.map(l => `<path d="${pts(l)}"/>`).join('')}<circle cx="${h[0]}" cy="${h[1]}" r="9"/></g>`;
function art(m, label) {
  return `<svg class="art" viewBox="0 0 200 150" role="img" aria-label="${esc(label || m.name)}">${FLOOR}${m.art}</svg>`;
}

// ---------- Machine catalog ----------
// pos: how you are on it (sit, lie, stand, kneel, cardio). move: what you do (push, pull, squeeze, curl, legs, core).
const START = 'Do 2–3 sets of 10–15 reps. Pick a weight where the last 2–3 reps feel hard but you can still keep good form. Rest 1–2 minutes between sets.';
const CARDIO_START = 'Go for 10–20 minutes at an easy pace: you should still be able to talk. Add a few minutes each week.';
const MACHINES = [
{ id: 'chest-press', name: 'Chest press machine', aka: ['Seated chest press', 'Machine bench press'],
  groups: ['chest', 'arms'], muscles: ['Chest', 'Front of shoulders', 'Triceps'], pos: ['sit'], move: ['push'],
  spot: 'Seat with an upright back pad and two handles sticking out in front of you at chest height.',
  art: L(40, 142, 40, 26, 62, 18, 118, 18) + L(80, 142, 80, 104) + R(56, 98, 42, 8) + R(48, 38, 9, 58)
    + B([66, 34], [66, 50, 72, 96], [66, 52, 88, 60, 114, 56], [72, 96, 106, 98, 108, 134, 118, 136])
    + M(118, 18, 118, 50) + M(112, 56, 120, 56) + A('M130 56H158'),
  setup: ['Set the seat height so the handles line up with the middle of your chest.', 'Sit with your back against the pad and feet flat on the floor.', 'Pick a light weight: move the pin in the weight stack.'],
  steps: ['Grip the handles with straight wrists.', 'Push forward until your arms are almost straight. Don\'t lock your elbows.', 'Let the handles come back slowly (2–3 seconds) until you feel a light stretch in your chest.', 'Breathe out as you push, breathe in as you come back.'],
  avoid: ['Seat too high or low, so the handles are at your shoulders or belly. It strains the shoulders.', 'Arching your back off the pad to push more.', 'Letting the weights slam down between reps.'] },

{ id: 'shoulder-press', name: 'Shoulder press machine', aka: ['Seated overhead press', 'Military press machine'],
  groups: ['shoulders', 'arms'], muscles: ['Shoulders', 'Triceps'], pos: ['sit'], move: ['push'],
  spot: 'Seat with an upright back pad and handles beside your shoulders that you push up over your head.',
  art: L(40, 142, 40, 8, 54, 8) + L(80, 142, 80, 104) + R(56, 98, 42, 8) + R(48, 38, 9, 58)
    + B([66, 34], [66, 50, 72, 96], [66, 52, 84, 40, 80, 14], [72, 96, 106, 98, 108, 134, 118, 136])
    + M(54, 8, 80, 8, 80, 18) + A('M100 40V12'),
  setup: ['Set the seat so the handles start at about shoulder height.', 'Sit with your back flat against the pad.'],
  steps: ['Grip the handles, elbows under your hands.', 'Push straight up until your arms are almost straight.', 'Lower slowly back to shoulder level.', 'Breathe out as you push up.'],
  avoid: ['Arching your lower back off the pad.', 'Locking your elbows hard at the top.', 'Seat so low that the handles start below your shoulders.'] },

{ id: 'lat-pulldown', name: 'Lat pulldown', aka: ['Pulldown machine', 'Cable pulldown'],
  groups: ['back', 'arms'], muscles: ['Upper back (lats)', 'Biceps', 'Back of shoulders'], pos: ['sit'], move: ['pull'],
  spot: 'Seat with pads that hold your thighs down, and a long bar hanging from a cable above your head.',
  art: L(156, 142, 156, 6, 100, 6) + L(80, 142, 80, 104) + R(62, 98, 40, 8) + L(130, 142, 130, 86, 118, 86)
    + B([80, 38], [78, 52, 82, 96], [78, 54, 92, 36, 98, 16], [82, 96, 112, 96, 114, 134, 124, 136])
    + R(100, 82, 24, 8) + M(100, 6, 100, 16) + M(84, 16, 114, 16) + A('M124 24V50'),
  setup: ['Adjust the thigh pad so your legs fit snugly under it with feet flat.', 'Stand, grab the bar a bit wider than your shoulders, palms facing away, then sit down with it.'],
  steps: ['Sit tall with your chest up and lean back just a little.', 'Pull the bar down to your upper chest, driving your elbows down and back.', 'Pause, then let the bar rise slowly until your arms are straight.'],
  avoid: ['Pulling the bar behind your neck. It strains the shoulders.', 'Swinging your body back to move the weight.', 'Letting the bar yank your arms up quickly.'] },

{ id: 'cable-row', name: 'Seated cable row', aka: ['Low row', 'Cable row'],
  groups: ['back', 'arms'], muscles: ['Middle back', 'Upper back (lats)', 'Biceps'], pos: ['sit'], move: ['pull'],
  spot: 'Long low bench with a foot platform at the end, and a cable coming out low from a weight stack.',
  art: L(26, 142, 26, 118) + L(104, 142, 104, 118) + R(20, 114, 96, 8) + L(122, 98, 122, 128) + L(160, 142, 160, 30) + L(148, 112, 160, 112)
    + B([62, 52], [62, 66, 62, 108], [62, 68, 50, 88, 74, 94], [62, 108, 92, 88, 114, 106, 116, 98])
    + D('M76 94L148 112') + M(74, 88, 78, 100) + A('M108 80H84'),
  setup: ['Clip a handle onto the cable if there isn\'t one (the V-shaped handle is the usual one).', 'Sit with your feet on the platform and knees slightly bent.'],
  steps: ['Sit tall holding the handle with straight arms.', 'Pull the handle to your belly button, squeezing your shoulder blades together.', 'Let your arms go forward slowly until straight. Keep your lower back from rounding.'],
  avoid: ['Rocking back and forth to move the weight.', 'Rounding your lower back.', 'Shrugging your shoulders up to your ears.'] },

{ id: 'machine-row', name: 'Seated row machine', aka: ['Chest-supported row', 'Row machine (not the rowing machine for cardio)'],
  groups: ['back', 'arms'], muscles: ['Middle back', 'Upper back (lats)', 'Biceps'], pos: ['sit'], move: ['pull'],
  spot: 'Seat facing a chest pad, with handles out in front that you pull back toward you.',
  art: L(80, 142, 80, 104) + R(58, 98, 40, 8) + L(110, 142, 110, 86) + R(100, 44, 9, 40) + L(150, 142, 150, 18)
    + B([82, 36], [78, 50, 74, 96], [78, 52, 64, 70, 98, 64], [74, 96, 104, 98, 106, 134, 116, 136])
    + M(150, 30, 120, 58, 100, 58, 100, 70) + A('M140 58H116'),
  setup: ['Set the seat so the handles are at the middle of your chest.', 'Set the chest pad so you can just reach the handles with straight arms.'],
  steps: ['Rest your chest on the pad and grab the handles.', 'Pull your elbows back past your body, squeezing your shoulder blades.', 'Return slowly until your arms are straight.'],
  avoid: ['Lifting your chest off the pad to throw the weight.', 'Short pulls that stop in front of your body.'] },

{ id: 'pec-deck', name: 'Pec deck (chest fly machine)', aka: ['Butterfly machine', 'Pec fly', 'Reverse fly / rear delt machine (same machine, sit facing the pad)'],
  groups: ['chest', 'shoulders'], muscles: ['Chest', 'Front of shoulders'], pos: ['sit'], move: ['squeeze', 'pull'],
  spot: 'Seat with a tall back pad and two arms that swing out to your sides at shoulder height, with handles or forearm pads.',
  view: 'front',
  art: R(88, 28, 24, 72) + L(100, 100, 100, 142) + L(100, 14, 60, 14, 60, 20) + L(100, 14, 140, 14, 140, 20)
    + B([100, 30], [100, 46, 100, 94], [100, 48, 76, 50, 72, 24], [100, 48, 124, 50, 128, 24], [94, 94, 86, 118, 86, 138], [106, 94, 114, 118, 114, 138])
    + `<rect class="mvf" x="62" y="20" width="7" height="36" rx="3"/><rect class="mvf" x="131" y="20" width="7" height="36" rx="3"/>`
    + A('M44 66H64') + A('M156 66H136'),
  setup: ['Set the seat so the handles are at chest height.', 'Set the start position of the arms (usually a lever at the top) so you feel only a light stretch at the start.'],
  steps: ['Sit with your back against the pad, elbows slightly bent and kept that way.', 'Bring the handles together in front of your chest, like hugging a big tree.', 'Squeeze, then open slowly until your arms are in line with your body, not further back.'],
  also: ['Reverse fly: sit facing the pad, move the arms to the back position, and push the handles apart. Works the back of your shoulders and upper back.'],
  avoid: ['Letting your arms go far behind your body. It strains the shoulders.', 'Bending and straightening your elbows, which turns it into a press.'] },

{ id: 'hip-machine', name: 'Hip abductor / adductor machine', aka: ['Outer thigh / inner thigh machine', 'Hip abduction', 'Hip adduction'],
  groups: ['legs', 'glutes'], muscles: ['Outer hips and glutes (pads outside)', 'Inner thighs (pads inside)'], pos: ['sit'], move: ['legs'],
  spot: 'Seat with pads against your knees, either outside or inside them. You push your legs apart or squeeze them together.',
  view: 'front',
  art: R(86, 40, 28, 62) + L(100, 104, 100, 142) + L(60, 140, 60, 100) + L(140, 140, 140, 100)
    + B([100, 40], [100, 56, 100, 98], [100, 60, 86, 82, 84, 100], [100, 60, 114, 82, 116, 100], [94, 98, 76, 112, 74, 138], [106, 98, 124, 112, 126, 138])
    + `<rect class="mvf" x="62" y="98" width="7" height="26" rx="3"/><rect class="mvf" x="131" y="98" width="7" height="26" rx="3"/>`
    + A('M58 92H38') + A('M142 92H162'),
  setup: ['Set the start position with the lever (often at the side). Start with a small range.', 'Outer thighs: pads on the outside of your knees. Inner thighs: pads on the inside. Some machines flip the pads, some gyms have two separate machines.'],
  steps: ['Sit back and hold the handles.', 'Push your legs apart (outer) or squeeze them together (inner) smoothly.', 'Return slowly, without letting the weights touch down.'],
  avoid: ['Letting the weight snap your legs back.', 'Starting with a very wide range.'] },

{ id: 'leg-press', name: 'Leg press', aka: ['Seated leg press', '45° leg press (the sled version you lie under)'],
  groups: ['legs', 'glutes'], muscles: ['Front of thighs (quads)', 'Glutes', 'Back of thighs (hamstrings)'], pos: ['sit', 'lie'], move: ['legs'],
  spot: 'Reclined seat with a big flat platform in front of your feet that you push away.',
  art: L(36, 142, 36, 112, 84, 112, 84, 142) + R(30, 104, 56, 8) + R(34, 42, 9, 64, -22) + L(170, 142, 170, 60, 140, 60)
    + B([42, 44], [48, 58, 64, 102], [48, 60, 60, 82, 72, 100], [64, 102, 94, 74, 112, 100])

  const v = $('#view-browse');
  if (!v.dataset.ready) {
    v.innerHTML = `<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search a name, nickname or muscle" autocomplete="off" enterkeyhint="search"></label>
      <div class="chips" id="groups">${GROUPS.map(([k, n]) => `<button class="chip" data-g="${k}" aria-pressed="false">${n}</button>`).join('')}</div>
      <div id="list"></div>`;
    v.dataset.ready = 1;
    $('#q').addEventListener('input', e => { app.query = e.target.value; renderList(); });
  }
  v.querySelectorAll('[data-g]').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === app.group));
  renderList();
}
function renderList() {
  const q = app.query.trim().toLowerCase();
  const list = MACHINES.filter(m => (app.group === 'all' || m.groups.includes(app.group))
    && (!q || [m.name, ...m.aka, ...m.muscles, ...m.groups].join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = list.length ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<p class="empty">Nothing matches “${esc(app.query)}”.<br>Try another word, or use <button class="link" data-go="identify">What's this?</button></p>`;
}
const SVG = {
  spot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  setup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  avoid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h0"/></svg>',
  also: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  start: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
};
function renderMachine(id) {
  const m = byId[id], v = $('#view-machine');
  if (!m) { location.hash = '#browse'; return; }
  const sect = (key, title, items, ordered, cls = '') => items && items.length ? `<section class="card sect ${cls}"><h3>${SVG[key]}${title}</h3><${ordered ? 'ol' : 'ul'}>${items.map(s => `<li>${esc(s)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}></section>` : '';
  v.innerHTML = `<article class="card hero">${art(m)}<div class="body">
      <h2>${esc(m.name)}</h2>
      ${m.aka.length ? `<p class="aka">Also called: ${esc(m.aka.join(' · '))}</p>` : ''}
      <div class="tags">${m.muscles.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="legend"><span><i></i>The part you move</span>${m.view === 'front' ? '<span>Front view</span>' : '<span>Side view</span>'}</div>
    </div></article>
    <section class="card sect"><h3>${SVG.spot}How to recognise it</h3><p>${esc(m.spot)}</p></section>
    ${sect('setup', 'Set it up', m.setup, true)}
    ${sect('steps', 'How to do it', m.steps, true)}
    ${sect('avoid', 'Avoid', m.avoid, false, 'warn')}
    ${sect('also', 'You can also use it for', m.also, false)}
    <section class="card sect start"><h3>${SVG.start}Beginner start</h3><p>${esc(m.start || START)}</p></section>
    <p class="note">Stop if something hurts (sharp or joint pain, not muscle effort). Ask gym staff to show you the machine the first time.</p>`;
}

function show(view) {
  for (const k of ['identify', 'browse', 'machine']) $('#view-' + k).hidden = k !== view;
  const inMachine = view === 'machine';
  $('#back').hidden = !inMachine;
  document.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', t.dataset.view === (inMachine ? app.tab : view)));
  if (!inMachine) app.tab = view;
}
let cameFromApp = false;
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('m/')) {
    const m = byId[h.slice(2)];
    renderMachine(h.slice(2)); show('machine'); $('#title').textContent = m ? m.name : 'Gym Guide'; window.scrollTo(0, 0);
  } else {
    const view = h === 'browse' ? 'browse' : 'identify';
    view === 'browse' ? renderBrowse() : renderIdentify();
    show(view); $('#title').textContent = view === 'browse' ? 'All machines' : 'What\'s this machine?';
    window.scrollTo(0, scrollMemo[view] || 0);
  }
}
const scrollMemo = {};
function go(hash) { scrollMemo[app.tab] = window.scrollY; cameFromApp = true; location.hash = hash; }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.m) return go('#m/' + t.dataset.m);
  if (t.dataset.view) { if (t.dataset.view === app.tab && $('#view-machine').hidden && t.dataset.view === 'identify') { app.pos = app.move = null; renderIdentify(); } return go('#' + t.dataset.view); }
  if (t.dataset.go) return go('#' + t.dataset.go);
  if (t.id === 'back') { if (cameFromApp && history.length > 1) history.back(); else location.hash = '#' + app.tab; return; }
  if (t.dataset.g) { app.group = t.dataset.g; return renderBrowse(); }
  if (t.dataset.reset) { if (t.dataset.reset === 'pos') app.pos = null; app.move = null; renderIdentify(); return window.scrollTo(0, 0); }
  const q = t.closest('[data-q]');
  if (q) { app[q.dataset.q] = t.dataset.v; renderIdentify(); window.scrollTo(0, 0); }
});
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
window.GG = { MACHINES, app };
</script>
